# ╰──────────────────────────────────────────────╯
# Palette:
#   Violet iris ..... #8888cc    Active accent (her eyes)
#   Golden letter ... #d4b06a    Golden highlight (her hair, brass keys)
#   Navy uniform .... #5a6088    Inactive muted blue
#   Crimson seal .... #c04858    Urgent / critical (wax seal red)
#   Emerald brooch .. #5a9e7a    Positive / charging (her brooch)
#   Ivory paper ..... #f0e8d8    Primary text (warm letter paper)
#   Midnight ink .... #1a1830    Deepest navy bar background

position = "Top"
region = "th-TH"

[modules]
left = [ "Workspaces" ]
center = [ "WindowTitle" ]
right = [ "KeyboardLayout", "SystemInfo", [ "Tray", "Tempo", "Settings" ] ]

# ── Workspaces ───────────────────────────
[workspaces]
visibility_mode = "All"
group_by_monitor = false
enable_workspace_filling = true

# ── Window Title ─────────────────────────
[window_title]
mode = "Title"
truncate_title_after_length = 60

# ── Keyboard Layout ──────────────────────
[keyboard_layout]
labels = { "English (US)" = "⌨️ EN", "Thai" = "⌨️ TH", "Japanese" = "⌨️ JP" }

# ── System Info ──────────────────────────
[system_info]
indicators = [ "Cpu", "Memory" ]
interval = 5

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

# ── Tempo (Clock + Weather) ─────────────
[tempo]
clock_format = "%a %d %b %R"
weather_location = { City = "Bangkok" }
weather_indicator = "IconAndTemperature"

# ── Tray ─────────────────────────────────
[tray]
blocklist = []
icon_size = 18
spacing = 8

# ── Settings Panel ───────────────────────
[settings]
lock_cmd = "gtklock"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"
battery_format = "IconAndPercentage"
peripheral_battery_format = "Icon"

# ── Appearance ───────────────────────────
[appearance]
style = "Islands"
font_name = "Ubuntu Nerd Font"

primary_color = "#8888cc"
success_color = "#5a9e7a"
warning_color = "#d4b06a"
danger_color = "#c04858"
text_color = "#f0e8d8"

workspace_colors = [ "#8888cc", "#d4b06a", "#5a9e7a" ]

[appearance.background_color]
base = "#1a1830"
weak = "#2a2850"
strong = "#3e3870"
