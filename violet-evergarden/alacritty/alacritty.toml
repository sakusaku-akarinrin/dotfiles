# ╭────────────────────────────────────────────╮
# │ ✉️  Violet Evergarden · Alacritty Config ✉️ │
# │ "I want to know what 'I love you' means."   │
# ╰────────────────────────────────────────────╯
#
# Palette:
#   Violet iris ...... #8888cc    Cursor / active accent (her eyes)
#   Golden letter .... #d4b06a    Yellow (warm highlight — her hair)
#   Crimson seal ..... #c04858    Red (errors / wax seal)
#   Emerald brooch ... #5a9e7a    Green (success — her brooch)
#   Navy uniform ..... #5a6088    Blue (muted — her uniform)
#   Ivory paper ...... #f0e8d8    Foreground text (letter paper)
#   Midnight ink ..... #100e1a    Background (deepest navy night)

[env]
TERM = "alacritty"

[window]
decorations = "None"
opacity = 0.92
padding = { x = 8, y = 4 }
dynamic_padding = false

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[scrolling]
history = 10000

[selection]
semantic_escape_chars = ",│`|:\\\"' ()[]{}<>\t"

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }

[colors]
[colors.primary]
foreground = "#f0e8d8"
background = "#100e1a"

[colors.cursor]
text = "#100e1a"
cursor = "#8888cc"

[colors.vi_mode_cursor]
text = "#100e1a"
cursor = "#d4b06a"

[colors.normal]
black   = "#141224"
red     = "#c04858"
green   = "#5a9e7a"
yellow  = "#d4b06a"
blue    = "#7888b8"
magenta = "#9888b8"
cyan    = "#78a8a0"
white   = "#d0c8b8"

[colors.bright]
black   = "#3a3848"
red     = "#d87888"
green   = "#78b890"
yellow  = "#e8c888"
blue    = "#98a8d0"
magenta = "#b0a0d0"
cyan    = "#98c0b8"
white   = "#f0e8d8"

[colors.dim]
black   = "#141224"
red     = "#a03848"
green   = "#4a8a6a"
yellow  = "#b09050"
blue    = "#6070a0"
magenta = "#8070a0"
cyan    = "#608a88"
white   = "#a8a098"

[mouse]
hide_when_typing = true

[bell]
animation = "EaseOutExpo"
duration = 0

[keyboard]
bindings = [
    { key = "V",        mods = "Control|Shift",    action = "Paste"            },
    { key = "C",        mods = "Control|Shift",    action = "Copy"             },
    { key = "F",        mods = "Control|Shift",    action = "SearchForward"    },
    { key = "B",        mods = "Control|Shift",    action = "SearchBackward"   },
    { key = "Insert",   mods = "Shift",            action = "PasteSelection"   },
    { key = "Key0",     mods = "Control",          action = "ResetFontSize"    },
    { key = "Equals",   mods = "Control",          action = "IncreaseFontSize" },
    { key = "Minus",    mods = "Control",          action = "DecreaseFontSize" },
]
