# │ ✉️  Violet Evergarden · Fuzzel Config  ✉️  │
# │ "I want to know what 'I love you' means."  │
# ╰────────────────────────────────────────────╯
#
# Palette:
#   Violet iris ...... #8888cc    Active accent (her eyes)
#   Golden letter .... #d4b06a    Matched substring (brass keys)
#   Crimson seal ..... #c04858    (wax seal red — unused here)
#   Navy uniform ..... #5a6088    Message / dim text
#   Ivory paper ...... #f0e8d8    Primary text (letter paper)
#   Midnight ink ..... #100e1a    Background (deepest navy)

[main]
font="Ubuntu Nerd Font:size=12"
use-bold=yes
dpi-aware=auto
prompt="❯ "
placeholder=Type to search...
icon-theme=Papirus
terminal="${TERMINAL:-alacritty} -e"
fields=name,keywords,generic,comment
show-actions=no
fuzzy=yes
lines=12
width=42

[border]
width=1
radius=12

[colors]
background=100e1aff
text=f0e8d8ff
message=5a6088ff
prompt=8888ccff
placeholder=5a6088dd
input=f0e8d8ff
match=d4b06aff
selection=8888cc2e
selection-text=f0e8d8ff
selection-match=d4b06aff
border=8888cc88
counter=5a6088ff
