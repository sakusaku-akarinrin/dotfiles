# ╭───────────────────────────────────────────────╮
# │ ✉️  Violet Evergarden · Fuzzel Config  ✉️    │
# │ "Every letter begins with a single word."      │
# ╰───────────────────────────────────────────────╯
#
# Palette:
#   Violet iris ...... #8888cc    Active accent (her eyes)
#   Golden letter .... #d4b06a    Matched substring (brass typewriter keys)
#   Crimson seal ..... #c04858    (wax seal red — unused here)
#   Navy uniform ..... #5a6088    Message / dim text
#   Ivory paper ...... #f0e8d8    Primary text (letter paper)
#   Midnight ink ..... #100e1a    Background (deepest navy)

[main]
font="Ubuntu Nerd Font:size=13"
use-bold=yes
dpi-aware=auto
prompt="✉️  "
placeholder="Type to search…"
icon-theme=Papirus
terminal="${TERMINAL:-alacritty} -e"
fields=name,keywords,generic,comment
show-actions=no
fuzzy=yes

# ── Layout ──────────────────────────────────────
lines=10
width=46
horizontal-pad=52
vertical-pad=18
inner-pad=10
image-size-ratio=0.72
line-height=26
letter-spacing=1

# ── Behaviour ───────────────────────────────────
layer=top
exit-on-keyboard-focus-loss=yes

[border]
width=1
radius=24

[colors]
background=100e1ae6
text=f0e8d8ff
message=5a6088ff
prompt=8888ccff
placeholder=5a6088cc
input=f0e8d8ff
match=d4b06aff
selection=8888cc33
selection-text=f0e8d8ff
selection-match=d4b06aff
border=8888cc88
counter=5a6088ff
