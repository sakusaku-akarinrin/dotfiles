[general]
gtk-theme=Adwaita-dark
idle-hide=true
idle-timeout=5
time-format=%H:%M

# Modules — build from source (see README), then uncomment:
# modules=userinfo-module.so;powerbar-module.so

[userinfo]
show-username=true
