# ╭────────────────────────────────────────────╮
# │  ✉️  Violet Evergarden · Starship Prompt  │
# │  Powerline Style                           │
# ╰────────────────────────────────────────────╯
# Palette
# ─────────────────────────────────────────
# Violet iris ..... #8888cc  (username fg)
# Golden letter ... #d4b06a  (emoji fg)
# Ivory paper ..... #f0e8d8  (directory fg)
# Crimson seal .... #c04858  (urgent)
# Deep indigo ..... #201840  (username bg)
# Deep violet ..... #282048  (emoji bg)
# Midnight ink .... #181530  (directory bg)
# Shell bg ........ #121212  (terminal background)

"$schema" = 'https://starship.rs/config-schema.json'

format = """
\
[](#201840)\
$username\
[](fg:#201840 bg:#282048)\
[ ✉️ ](fg:#d4b06a bg:#282048)\
[](fg:#282048 bg:#181530)\
$directory\
[](fg:#181530)\
$git_branch\
$git_status\
$fill\
$all\
$line_break\
$character\
"""

# No blank line at the start
add_newline = false

# ─── Username ──────────────────────────────

[username]
style_user = "fg:#8888cc bg:#201840 bold"
format = "[ $user ]($style)"
show_always = true

# ─── Directory ──────────────────────────────

[directory]
style = "fg:#f0e8d8 bg:#181530"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"
home_symbol = "~"
use_os_path_sep = true

[directory.substitutions]
"Documents" = "📄 "
"Downloads" = "⬇️ "
"Music" = "🎵 "
"Pictures" = "🖼️ "
"Projects" = "💻 "
"dotfiles" = "💌 dotfiles"

# ─── Git — Branch & Status ──────────────────

[git_branch]
style = "fg:#d4b06a"
format = " on [$symbol$branch]($style)"
symbol = " "

[git_status]
style = "fg:#5a6088"
format = '[$all_status$ahead_behind]($style)'
conflicted = "🏳️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = " ?${count}"
stashed = " 📦"
modified = " !${count}"
staged = " ✚${count}"
renamed = " →${count}"
deleted = " ✘${count}"

# ─── Runtime Versions — Subtle Right Side ─────

[nodejs]
style = "fg:#5a6088"
format = " via [$symbol($version)]($style)"
symbol = " "
disabled = false

[python]
style = "fg:#5a6088"
format = " via [$symbol($version)]($style)"
symbol = "🐍 "
disabled = false

[rust]
style = "fg:#5a6088"
format = " via [$symbol($version)]($style)"
symbol = " "
disabled = false

[bun]
style = "fg:#5a6088"
format = " [$symbol($version)]($style)"
symbol = " "
disabled = false

# ─── Fill (pushes runtime versions to the right) ──

[fill]
symbol = ""

# ─── Prompt Character ────────────────────────

[character]
success_symbol = "[❯](bold #8888cc)"
error_symbol = "[❯](bold #c04858)"
vimcmd_symbol = "[❮](bold #5a6088)"
vimcmd_replace_one_symbol = "[❮](bold #d4b06a)"
vimcmd_replace_symbol = "[❮)](bold #8888cc)"
format = "$symbol "
