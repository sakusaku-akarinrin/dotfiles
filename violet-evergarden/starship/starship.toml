# ╭────────────────────────────────────────────╮
# │  ✉️  Violet Evergarden · Starship Prompt  │
# │  Powerline Style · Light Bg, Dark Text     │
# ╰────────────────────────────────────────────╯
# Palette
# ─────────────────────────────────────────────
# Soft iris ....... #c4bce0  (username bg)
# Soft golden ..... #ddd0a8  (emoji bg)
# Soft lavender ... #d0cce0  (directory bg)
# Deep violet ..... #1a0820  (username fg)
# Dark ink ........ #1a0820  (emoji fg)
# Near-black ...... #0e0620  (directory fg)
# Crimson seal .... #c04858  (urgent)

"$schema" = 'https://starship.rs/config-schema.json'

format = """
\
[](#c4bce0)\
$username\
[](fg:#c4bce0 bg:#ddd0a8)\
[ ✉️ ](fg:#1a0820 bg:#ddd0a8)\
[](fg:#ddd0a8 bg:#d0cce0)\
$directory\
[](fg:#d0cce0)\
$git_branch\
$git_status\
$fill\
$all\
$line_break\
$character\
"""

add_newline = true

# ─── Username ──────────────────────────────

[username]
style_user = "fg:#1a0820 bg:#c4bce0 bold"
format = "[ $user ]($style)"
show_always = true

# ─── Directory ──────────────────────────────

[directory]
style = "fg:#0e0620 bg:#d0cce0"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"
home_symbol = "~"
use_os_path_sep = true

[directory.substitutions]
"Documents" = "📄 "
"Downloads" = "⬇️ "
"Music" = "🎵 "
"Pictures" = "🖼️ "
"Projects" = "💻 "
"dotfiles" = "💌 dotfiles"

# ─── Git — Branch & Status ──────────────────

[git_branch]
style = "fg:#1a0820"
format = " on [$symbol$branch]($style)"
symbol = " "

[git_status]
style = "fg:#1a0820"
format = '[$all_status$ahead_behind]($style)'
conflicted = "🏳️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = " ?${count}"
stashed = " 📦"
modified = " !${count}"
staged = " ✚${count}"
renamed = " →${count}"
deleted = " ✘${count}"

# ─── Runtime Versions — Subtle Right Side ─────

[nodejs]
style = "fg:#c4bce0"
format = " via [$symbol($version)]($style)"
symbol = " "
disabled = false

[python]
style = "fg:#c4bce0"
format = " via [$symbol($version)]($style)"
symbol = "🐍 "
disabled = false

[rust]
style = "fg:#c4bce0"
format = " via [$symbol($version)]($style)"
symbol = " "
disabled = false

[bun]
style = "fg:#c4bce0"
format = " [$symbol($version)]($style)"
symbol = " "
disabled = false

# ─── Fill (pushes runtime versions to the right) ──

[fill]
symbol = ""

# ─── Prompt Character ────────────────────────

[character]
success_symbol = "[❯](bold #c4bce0)"
error_symbol = "[❯](bold #c04858)"
vimcmd_symbol = "[❮](bold #d0cce0)"
vimcmd_replace_one_symbol = "[❮](bold #ddd0a8)"
vimcmd_replace_symbol = "[❮)](bold #c4bce0)"
format = "$symbol "
