# ╭──────────────────────────────────────────────╮
# │  🌸  Akane Sakurai · Fuzzel Config  🌸     │
# │  Sakura Season — "floating petals" launcher  │
# ╰──────────────────────────────────────────────╯
#
# Palette:
#   Cherry blossom ... #f0a0b0    Active accent
#   Pale rose ........ #d4a8b8    Borders / highlights
#   Warm white ....... #f0e4e8    Primary text
#   Akane red ........ #d44a5a    Matched substring
#   Soft lavender .... #7b7b9e    Message / dim text
#   Deep night ....... #161218    Background

[main]
font="Ubuntu Nerd Font:size=13"
use-bold=yes
dpi-aware=auto
prompt="🌸  "
placeholder="Type to search…"
icon-theme=Papirus
terminal="${TERMINAL:-alacritty} -e"
fields=name,keywords,generic,comment
show-actions=no
fuzzy=yes

# ── Layout ──────────────────────────────────────
lines=10
width=46
horizontal-pad=52
vertical-pad=18
inner-pad=10
image-size-ratio=0.72
line-height=26
letter-spacing=0

# ── Behaviour ───────────────────────────────────
layer=top
exit-on-keyboard-focus-loss=yes

[border]
width=1
radius=24

[colors]
background=161218e6
text=f0e4e8ff
message=7b7b9eff
prompt=f0a0b0ff
placeholder=7b7b9ecc
input=f0e4e8ff
match=d44a5aff
selection=f0a0b033
selection-text=f0e4e8ff
selection-match=d44a5aff
border=d4a8b888
counter=7b7b9eff
