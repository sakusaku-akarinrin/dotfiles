# ╭────────────────────────────────────────────╮
# │  🌸  Sakura Season · Starship Prompt  🌸  │
# │  Powerline Style · Light Bg, Dark Text     │
# ╰────────────────────────────────────────────╯
# Palette
# ─────────────────────────────────────────────
# Cherry blossom .. #f0c8d0  (username bg)
# Rose ............ #e0b8c8  (emoji bg)
# Lavender ........ #c4c0d8  (directory bg)
# Dark rosewood ... #2a1018  (username fg)
# Dark rose ....... #2a1018  (emoji fg)
# Near-black ...... #100818  (directory fg)
# Madder red ...... #d44a5a  (urgent)

"$schema" = 'https://starship.rs/config-schema.json'

format = """
\
[](#f0c8d0)\
$username\
[](fg:#f0c8d0 bg:#e0b8c8)\
[ 🌸 ](fg:#2a1018 bg:#e0b8c8)\
[](fg:#e0b8c8 bg:#c4c0d8)\
$directory\
[](fg:#c4c0d8)\
$git_branch\
$git_status\
$fill\
$all\
$line_break\
$character\
"""

add_newline = true

# ─── Username ──────────────────────────────

[username]
style_user = "fg:#2a1018 bg:#f0c8d0 bold"
format = "[ $user ]($style)"
show_always = true

# ─── Directory ──────────────────────────────

[directory]
style = "fg:#100818 bg:#c4c0d8"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"
home_symbol = "~"
use_os_path_sep = true

[directory.substitutions]
"Documents" = "📄 "
"Downloads" = "⬇️ "
"Music" = "🎵 "
"Pictures" = "🖼️ "
"Projects" = "💻 "
"dotfiles" = "🌸 dotfiles"

# ─── Git — Branch & Status ──────────────────

[git_branch]
style = "fg:#2a1018"
format = " on [$symbol$branch]($style)"
symbol = " "

[git_status]
style = "fg:#2a1018"
format = '[$all_status$ahead_behind]($style)'
conflicted = "🏳️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = " ?${count}"
stashed = " 📦"
modified = " !${count}"
staged = " ✚${count}"
renamed = " →${count}"
deleted = " ✘${count}"

# ─── Runtime Versions — Subtle Right Side ─────

[nodejs]
style = "fg:#f0c8d0"
format = " via [$symbol($version)]($style)"
symbol = " "
disabled = false

[python]
style = "fg:#f0c8d0"
format = " via [$symbol($version)]($style)"
symbol = "🐍 "
disabled = false

[rust]
style = "fg:#f0c8d0"
format = " via [$symbol($version)]($style)"
symbol = " "
disabled = false

[bun]
style = "fg:#f0c8d0"
format = " [$symbol($version)]($style)"
symbol = " "
disabled = false

# ─── Fill (pushes runtime versions to the right) ──

[fill]
symbol = ""

# ─── Prompt Character ────────────────────────

[character]
success_symbol = "[❯](bold #f0c8d0)"
error_symbol = "[❯](bold #d44a5a)"
vimcmd_symbol = "[❮](bold #c4c0d8)"
vimcmd_replace_one_symbol = "[❮](bold #e0b8c8)"
vimcmd_replace_symbol = "[❮](bold #f0c8d0)"
format = "$symbol "
