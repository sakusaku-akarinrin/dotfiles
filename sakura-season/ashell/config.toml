# ╭──────────────────────────────────────────────╮
# │   🌸  Akane Sakurai · Ashell Config  🌸    │
# │   Sakura Season — soft, warm, polished.     │
# ╰──────────────────────────────────────────────╯
# Palette:
#   Cherry blossom ... #f0a0b0    Active accent
#   Pale rose ........ #d4a8b8    Borders / subtle highlights
#   Warm white ....... #f0e4e8    Primary text
#   Akane red ........ #d44a5a    Warnings / critical
#   Soft sage ........ #a0d4a8    Positive / charging

position = "Top"

[modules]
left = [ "Workspaces" ]
center = [ "WindowTitle" ]
right = [ "KeyboardLayout", "SystemInfo", [ "Tray", "Tempo", "Settings" ] ]

# ── Workspaces ───────────────────────────
[workspaces]
visibility_mode = "All"
group_by_monitor = false
enable_workspace_filling = true

# ── Window Title ─────────────────────────
[window_title]
mode = "Title"
truncate_title_after_length = 60

# ── Keyboard Layout ──────────────────────
[keyboard_layout]
labels = { "English (US)" = "⌨️ EN", "Thai" = "⌨️ TH", "Japanese" = "⌨️ JP" }

# ── System Info ──────────────────────────
[system_info]
indicators = [ "Cpu", "Memory" ]
interval = 5

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

# ── Tempo (Clock + Weather) ─────────────
[tempo]
clock_format = "%a %d %b %R"
weather_location = { City = "Bangkok" }
weather_indicator = "IconAndTemperature"

# ── Tray ─────────────────────────────────
[tray]
blocklist = []
icon_size = 18
spacing = 8

# ── Settings Panel ───────────────────────
[settings]
lock_cmd = "gtklock"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"
battery_format = "IconAndPercentage"
peripheral_battery_format = "Icon"

# ── Appearance ───────────────────────────
[appearance]
style = "Islands"
font_name = "Ubuntu Nerd Font"

primary_color = "#f0a0b0"
success_color = "#a0d4a8"
warning_color = "#e8a870"
danger_color = "#d44a5a"
text_color = "#f0e4e8"

workspace_colors = [ "#f0a0b0", "#d4a8b8" ]

[appearance.background_color]
base = "#161218"
weak = "#2a222c"
strong = "#3e3238"
